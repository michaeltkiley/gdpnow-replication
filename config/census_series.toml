# Census series read from the Census Bureau's bulk program files (https://www.census.gov/econ_datasets/, one zip per
# program: https://www.census.gov/econ_getzippedfile/?programCode=<CODE>). gdpnow/census_bulk.py reads them.

# Economic Indicator Time Series (EITS) program ids used in the code (Census API dataset names) -> program code of the zip.
[eits]
advm3 = "M3ADV"
m3 = "M3"
mwtsadv = "MWTSADV"
mrts = "MRTS"
mrtsadv = "MRTSADV"
ftdadv = "FTDADV"

# FRED series that Census itself publishes -> [program, category code, data type code, is_adj (1 = seasonally adjusted), geography].
# Values equal FRED's on every shared month (checked in exploration rounds 15 and 17).
[fred]
HOUST = ["RESCONST", "ASTARTS", "TOTAL", 1, "US"]
HOUST1F = ["RESCONST", "ASTARTS", "SINGLE", 1, "US"]
HSN1F = ["RESSALES", "ASOLD", "TOTAL", 1, "US"]
ASPNHSUS = ["RESSALES", "SOLD", "AVERAG", 0, "US"]
TLPBLCONS = ["VIP", "AXXXX", "P", 1, "US"]
PNRESCONS = ["VIP", "ANRXX", "V", 1, "US"]

# M3 (full report): FRED's A-prefixed manufacturers' series
AMDMTI = ["M3", "MDM", "TI", 1, "US"]
AMDMVS = ["M3", "MDM", "VS", 1, "US"]
AMNMTI = ["M3", "MNM", "TI", 1, "US"]
AMNMVS = ["M3", "MNM", "VS", 1, "US"]
AMTMTI = ["M3", "MTM", "TI", 1, "US"]
AMTMVS = ["M3", "MTM", "VS", 1, "US"]
ACRPVS = ["M3", "CRP", "VS", 1, "US"]
ADEFVS = ["M3", "DEF", "VS", 1, "US"]
ANAPVS = ["M3", "NAP", "VS", 1, "US"]
ANXAVS = ["M3", "NXA", "VS", 1, "US"]
DGORDER = ["M3", "MDM", "NO", 1, "US"]
# Advance monthly retail sales (MARTS)
RSAFS = ["MARTS", "44X72", "SM", 1, "US"]
RSFSDP = ["MARTS", "722", "SM", 1, "US"]
RSBMGESD = ["MARTS", "444", "SM", 1, "US"]
RSEAS = ["MARTS", "443", "SM", 1, "US"]
RSFHFS = ["MARTS", "442", "SM", 1, "US"]
RSMVPD = ["MARTS", "441", "SM", 1, "US"]
RSXFS = ["MARTS", "44000", "SM", 1, "US"]
# Monthly wholesale trade (MWTS)
WHLSLRIMSA = ["MWTS", "42", "IM", 1, "US"]
WHLSLRIRSA = ["MWTS", "42", "IR", 1, "US"]
WHLSLRSMSA = ["MWTS", "42", "SM", 1, "US"]

# Housing by region and permits (RESCONST), months' supply and houses for sale (RESSALES), inventory-to-sales ratios (MTIS), manufactured
# housing shipments and placements (MHS2). Exact on every shared month (exploration round 21).
HOUSTMW = ["RESCONST", "ASTARTS", "TOTAL", 1, "MW"]
HOUSTNE = ["RESCONST", "ASTARTS", "TOTAL", 1, "NO"]
HOUSTS = ["RESCONST", "ASTARTS", "TOTAL", 1, "SO"]
HOUSTW = ["RESCONST", "ASTARTS", "TOTAL", 1, "WE"]
PERMIT = ["RESCONST", "APERMITS", "TOTAL", 1, "US"]
MSACSR = ["RESSALES", "FORSALE", "MONSUP", 1, "US"]
HNFSEPUSSA = ["RESSALES", "FORSALE", "TOTAL", 1, "US"]
RETAILIRSA = ["MTIS", "RETAIL", "IR", 1, "US"]
MNFCTRIRSA = ["MTIS", "MNFCTR", "IR", 1, "US"]
SHTSAUS = ["MHS2", "T", "SH", 1, "US"]
SPTNSAUS = ["MHS2", "T", "SP", 0, "US"]
