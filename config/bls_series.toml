# BLS series read from BLS's flat files (https://download.bls.gov/pub/time.series/) instead of FRED / the BLS API.
# Each entry: FRED id = [BLS series id, flat file holding the series' FULL history]. Derived and checked in
# tools/explore_apis.py (rounds 6-8): the values equal FRED's on every shared date (max abs difference 0.0), and the
# file starts in the same month as FRED's series. The ".Current" files start in the mid-1990s and are not used
# where older history exists. A series missing here (or any failure to fetch its file) falls back to FRED.

[series]
