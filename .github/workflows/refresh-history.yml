name: refresh-history

# Manual approval in two steps: run with apply = false (default) to see which borrowed values the newest workbook revised, then run again
# with apply = true to replace them in the stored history. Never scheduled.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the refresh (false = dry run, changes nothing)'
        type: boolean
        default: false

# Shares the daily run's group: the refresh and a daily run never touch the state at the same time.
concurrency:
  group: daily-nowcast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data/gdpnow.duckdb
          key: state-none
          restore-keys: state-
      - name: Download the newest workbook and plan or apply the refresh
        run: |
          python scripts/01_ingest_workbook.py --date "$(TZ=America/Chicago date +%Y%m%d)"
          python scripts/14_refresh_history.py ${{ inputs.apply && '--apply' || '' }} --out refresh.md
      - name: Report
        if: always()
        run: '[ -f refresh.md ] && cat refresh.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Save state (the daily run restores the newest)
        if: inputs.apply
        uses: actions/cache/save@v4
        with:
          path: data/gdpnow.duckdb
          key: state-refresh-${{ github.run_id }}
