name: daily-nowcast

on:
  schedule:
    - cron: '30 21 * * 1-5'      # weekdays 21:30 UTC, after the day's releases and the Atlanta Fed update
  workflow_dispatch:
    inputs:
      asof:
        description: 'As-of date YYYY-MM-DD (default today, UTC)'
        required: false
      force:
        description: 'Recompute even if the day is already done'
        type: boolean
        default: false

# One run at a time, ever: later triggers queue behind the current run instead of racing it for the commit.
concurrency:
  group: daily-nowcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y poppler-utils
      - name: Restore state (archived pulls, estimates)
        uses: actions/cache/restore@v4
        with:
          path: data/gdpnow.duckdb
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Daily run
        id: run
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_CONTACT: ${{ secrets.BLS_CONTACT }}
        run: |
          python scripts/daily.py ${{ inputs.asof && format('--asof {0}', inputs.asof) || '' }} ${{ inputs.force && '--force' || '' }}
      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/gdpnow.duckdb
          key: state-${{ github.run_id }}
      - name: Commit results
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          if [ "${{ steps.run.outcome }}" = "success" ]; then git add docs/data; else git add docs/data/status.json; fi
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F): ${{ steps.run.outcome }}"
          git restore .        # discard other tracked files the run rewrote (e.g. registry/workbook_history_prefix.csv)
          git pull --rebase origin main && git push origin HEAD:main
      - name: Fail the job if the run failed or was held (GitHub emails on failure)
        if: steps.run.outcome != 'success'
        run: exit 1
