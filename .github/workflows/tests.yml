name: tests

on:
  pull_request:
  push:
    branches-ignore: [main, data]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (the freshness check replays two years of release calendar)
        run: python -m unittest discover -s tests -v
