name: explore-apis
on:
  workflow_dispatch:
    inputs:
      which:
        description: 'Space-separated test groups'
        required: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb pandas
      - uses: actions/cache/restore@v4
        with:
          path: data/gdpnow.duckdb
          key: explore-none
          restore-keys: state-
      - env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_CONTACT: ${{ secrets.BLS_CONTACT }}
        run: python tools/explore_apis.py ${{ inputs.which || 'bea10' }}
